<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>QuikSearcher - Create Account</title>

    <style>
        * {
            box-sizing: border-box;
        }

        @font-face {
            font-family: basefont;
            src: url("fonts/Scanport-1.ttf");
        }

        body {
            margin: 0;
            background-color: #fffdd0;
            font-family: basefont, monospace;
            color: #26436D;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .signup-box {
            width: 90%;
            max-width: 500px;

            background-color: #FFFFFF;

            border: 2px solid #D3A5AF;
            border-radius: 16px;

            padding: 30px;
        }

        .signup-box h1 {
            margin-top: 0;
            margin-bottom: 25px;

            color: #26436D;
            text-align: center;
        }

        .signup-box label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;

            color: #26436D;
        }

        .signup-box input,
        .signup-box select {
            width: 100%;

            padding: 12px;

            border: 2px solid #D3A5AF;
            border-radius: 8px;

            background-color: #fffdd0;
            color: #26436D;

            font-family: inherit;
            font-size: 16px;
        }

        .signup-box input:focus,
        .signup-box select:focus {
            outline: none;
            border-color: #26436D;
        }

        .newsletter {
            margin-top: 18px;

            display: flex !important;
            align-items: center;

            gap: 8px;
        }

        .newsletter input {
            width: auto;
        }

        .signup-button {
            width: 100%;

            margin-top: 20px;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background-color: #26436D;
            color: #FFFFFF;

            font-family: inherit;
            font-size: 18px;

            cursor: pointer;

            opacity: 1;

            transition:
                transform 0.15s ease,
                background-color 0.15s ease,
                opacity 0.15s ease;
        }

        .signup-button:disabled {
            background-color: #D3A5AF;
            color: #FFFFFF;

            opacity: 0.35;

            cursor: not-allowed;
            transform: none;
        }

        .signup-button:not(:disabled) {
            background-color: #26436D;
            color: #FFFFFF;

            opacity: 1;

            cursor: pointer;
        }

        .signup-button:not(:disabled):hover {
            background-color: #D3A5AF;
            transform: scale(1.02);
        }
    </style>
</head>

<body>

    <div class="signup-box">

        <h1>Create Your QuikSearcher Account</h1>

        <form id="signupForm">

            <label for="firstName">
                First Name
            </label>

            <input
                type="text"
                id="firstName"
                name="firstName"
                required
            >

            <label for="lastName">
                Last Name
            </label>

            <input
                type="text"
                id="lastName"
                name="lastName"
                required
            >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <label for="country">
                Country
            </label>

            <select
                id="country"
                name="country"
                required
            >
                <option value="">
                    Select your country
                </option>

                <option value="NG">
                    Nigeria
                </option>

                <option value="US">
                    United States
                </option>

                <option value="GB">
                    United Kingdom
                </option>

                <option value="FR">
                    France
                </option>

                <option value="ES">
                    Spain
                </option>

                <option value="IT">
                    Italy
                </option>

                <option value="EG">
                    Egypt
                </option>

                <option value="IN">
                    India
                </option>

                <option value="JP">
                    Japan
                </option>
            </select>

            <label for="currency">
                Currency
            </label>

            <select
                id="currency"
                name="currency"
                required
            >
                <option value="NGN">
                    Nigerian Naira (₦)
                </option>

                <option value="USD">
                    US Dollar ($)
                </option>

                <option value="GBP">
                    British Pound (£)
                </option>

                <option value="EUR">
                    Euro (€)
                </option>

                <option value="EGP">
                    Egyptian Pound (E£)
                </option>

                <option value="INR">
                    Indian Rupee (₹)
                </option>

                <option value="JPY">
                    Japanese Yen (¥)
                </option>
            </select>

            <label class="newsletter">

                <input
                    type="checkbox"
                    id="newsletter"
                    name="newsletter"
                >

                Subscribe me to the QuikSearcher newsletter

            </label>

            <button
                type="submit"
                class="signup-button"
                disabled
            >
                Create Account
            </button>

        </form>

    </div>

    <script>

        const country =
            document.getElementById("country");

        const currency =
            document.getElementById("currency");

        const firstName =
            document.getElementById("firstName");

        const lastName =
            document.getElementById("lastName");

        const email =
            document.getElementById("email");

        const password =
            document.getElementById("password");

        const signupButton =
            document.querySelector(".signup-button");

        const signupForm =
            document.getElementById("signupForm");


        const countryCurrencies = {

            NG: "NGN",

            US: "USD",

            GB: "GBP",

            FR: "EUR",

            ES: "EUR",

            IT: "EUR",

            EG: "EGP",

            IN: "INR",

            JP: "JPY"

        };


        function checkForm() {

            const everythingFilled =

                firstName.value.trim() !== "" &&

                lastName.value.trim() !== "" &&

                email.value.trim() !== "" &&

                password.value.trim() !== "" &&

                country.value !== "" &&

                currency.value !== "";


            signupButton.disabled =
                !everythingFilled;
        }


        country.addEventListener(
            "change",
            function () {

                const selectedCountry =
                    this.value;

                const matchingCurrency =
                    countryCurrencies[selectedCountry] ||
                    "USD";

                currency.value =
                    matchingCurrency;

                checkForm();
            }
        );


        firstName.addEventListener(
            "input",
            checkForm
        );


        lastName.addEventListener(
            "input",
            checkForm
        );


        email.addEventListener(
            "input",
            checkForm
        );


        password.addEventListener(
            "input",
            checkForm
        );


        currency.addEventListener(
            "change",
            checkForm
        );


        signupForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                alert(
                    "The signup form works! Account storage will be added later."
                );

            }
        );


        checkForm();

    </script>

</body>

</html>
