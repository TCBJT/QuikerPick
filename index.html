```html
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuikerPick: Pick it Quiker</title>

<style>
* {box-sizing: border-box;}

body {
  margin: 0;
  font-family: basefont;
  background-color: #fffdd0;
}

.topnav {
  overflow: hidden;
  background-color: #26436D;
  padding: 4px 8px;
}

.topnav a {
  float: left;
  display: block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
}

.topnav a:hover {
  background-color: #D3A5AF;
  color: #FFFFFF;
}

.topnav a.active {
  background-color: #D3A5AF;
  color: white;
}

.topnav .search-container {
  float: right;
}

.topnav input[type=text] {
  padding: 10px 14px;
  margin-top: 8px;
  font-size: 17px;
  border: 2px solid #D3A5AF;
  border-radius: 8px;
  background-color: #fffdd0;
  color: #26436D;
  outline: none;
}

.topnav input[type=text]:focus {
  border-color: #26436D;
  box-shadow: 0 0 0 3px rgba(211, 165, 175, 0.35);
}

.topnav .search-container button {
  float: right;
  padding: 10px 16px;
  margin-top: 8px;
  margin-right: 16px;
  background-color: #D3A5AF;
  color: #FFFFFF;
  font-size: 17px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.15s ease, background-color 0.15s ease;
}

.topnav .search-container button:hover {
  background-color: #26436D;
  transform: scale(1.05);
}

@media screen and (max-width: 600px) {
  .topnav .search-container {
    float: none;
  }

  .topnav a,
  .topnav input[type=text],
  .topnav .search-container button {
    float: none;
    display: block;
    text-align: left;
    width: 100%;
    margin: 4px 0;
    padding: 14px;
  }

  .topnav input[type=text] {
    border: 1px solid #D3A5AF;
  }

  #productResults {
    gap: 15px;
  }

  #productResults a > div {
    width: 100%;
  }
}

@font-face {
  font-family: basefont;
  src: url(fonts/Scanport-1.ttf);
}

#currencySelect {
  padding: 10px 14px;
  margin: 10px 0;
  font-size: 16px;
  font-family: inherit;
  background-color: #fffdd0;
  color: #26436D;
  border: 2px solid #D3A5AF;
  border-radius: 8px;

</head>

<body>

<div class="topnav">
  <a class="active" href="#home">Home</a>
  <a href="#about">About</a>
  <a href="signup.html">Signup</a>

  <div class="search-container">
    <form>
      <input type="text" placeholder="Search.." name="search">
      <button type="submit">Submit</button>
    </form>
  </div>
</div>

<div style="font-size: x-large;" id="results"></div>

<script>

const ETSY_FUNCTION_URL =
    "https://nhhfskfggryiqbyvjbzj.supabase.co/functions/v1/etsy-api";

const params =
    new URLSearchParams(window.location.search);

const search =
    params.get("search");

async function showResults() {

    if (!search) {
        return;
    }

    let selectedCurrency = "NGN";
    let currentPage = 1;
    let hasMore = true;

    const currencies = {
        NGN: "Nigerian Naira (₦)",
        USD: "US Dollar ($)",
        GBP: "British Pound (£)",
        EUR: "Euro (€)",
        EGP: "Egyptian Pound (E£)",
        INR: "Indian Rupee (₹)",
        JPY: "Japanese Yen (¥)"
    };

    let exchangeRates;

    try {

        const response =
            await fetch(
                "https://open.er-api.com/v6/latest/NGN"
            );

        const data =
            await response.json();

        if (data.result !== "success") {
            throw new Error(
                "Exchange rate request failed."
            );
        }

        exchangeRates =
            data.rates;

    } catch (error) {

        document.getElementById("results").innerHTML =
            "<h2>Search results for: " +
            search +
            "</h2>" +
            "<p>We couldn't load the exchange rates right now.</p>";

        return;
    }

    let currencyOptions = "";

    for (const code in currencies) {

        currencyOptions +=
            "<option value='" +
            code +
            "'" +
            (code === selectedCurrency ? " selected" : "") +
            ">" +
            currencies[code] +
            "</option>";
    }

    let resultsHTML =
        "<h2>Search results for: " +
        search +
        "</h2>" +

        "<label for='currencySelect'>Currency: </label>" +

        "<select id='currencySelect'>" +
            currencyOptions +
        "</select>" +

        "<div id='productResults'></div>" +

        "<button id='loadMoreButton'>Load More</button>";

    document.getElementById("results").innerHTML =
        resultsHTML;


    async function displayProducts(currencyCode, page) {

        const response =
            await fetch(
                ETSY_FUNCTION_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            search: search,
                            page: page
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            console.error(
                "Etsy request failed:",
                data
            );

            document.getElementById(
                "productResults"
            ).innerHTML +=
                "<p>Could not load Etsy products.</p>";

            return;
        }

        const matchingProducts =
            data.results || [];

        let productsHTML = "";

        matchingProducts.forEach(product => {

            let priceInNGN;

            const originalCurrency =
                product.price.currency_code;

            const originalPrice =
                Number(product.price.amount) /
                Number(product.price.divisor || 100);

            if (originalCurrency === "NGN") {

                priceInNGN =
                    originalPrice;

            } else {

                const rateToNGN =
                    exchangeRates[originalCurrency];

                if (!rateToNGN) {
                    return;
                }

                priceInNGN =
                    originalPrice /
                    rateToNGN;
            }

            const exchangeRate =
                exchangeRates[currencyCode] || 1;

            const convertedPrice =
                priceInNGN *
                exchangeRate;

            const formattedPrice =
                new Intl.NumberFormat(
                    undefined,
                    {
                        style: "currency",
                        currency: currencyCode
                    }
                ).format(convertedPrice);

            const productLink =
                "https://www.etsy.com/listing/" +
                product.listing_id;

            // Limit product title to 10 words
            const titleWords =
                product.title.trim().split(/\s+/);

            const shortTitle =
                titleWords.length > 10
                    ? titleWords.slice(0, 10).join(" ") + "..."
                    : product.title;

            // Get Etsy product image
            const imageUrl =
                product.images &&
                product.images.length > 0
                    ? product.images[0].url_570xN
                    : null;

            productsHTML +=

                "<a href='" +
                productLink +
                "' target='_blank' " +
                "style='text-decoration: none; color: inherit;'>" +

                    "<div>" +

                        (imageUrl
                            ? "<img src='" +
                              imageUrl +
                              "' alt='" +
                              shortTitle.replace(/'/g, "&#39;") +
                              "'>"
                            : "") +

                        "<h3>" +
                        shortTitle +
                        "</h3>" +

                        "<p>Store: Etsy</p>" +

                        "<p>Price: " +
                        formattedPrice +
                        "</p>" +

                    "</div>" +

                "</a>";
        });

        document.getElementById(
            "productResults"
        ).innerHTML +=
            productsHTML;

        hasMore =
            data.hasMore;

        if (!hasMore) {

            document.getElementById(
                "loadMoreButton"
            ).style.display =
                "none";
        }
    }


    await displayProducts(
        selectedCurrency,
        currentPage
    );


    document
        .getElementById("loadMoreButton")
        .addEventListener(
            "click",
            async function () {

                if (!hasMore) {
                    return;
                }

                currentPage++;

                await displayProducts(
                    selectedCurrency,
                    currentPage
                );
            }
        );


    document
        .getElementById("currencySelect")
        .addEventListener(
            "change",
            async function () {

                selectedCurrency =
                    this.value;

                document.getElementById(
                    "productResults"
                ).innerHTML = "";

                currentPage = 1;
                hasMore = true;

                document.getElementById(
                    "loadMoreButton"
                ).style.display =
                    "block";

                await displayProducts(
                    selectedCurrency,
                    currentPage
                );
            }
        );
}

showResults();

</script>

</body>
</html>
