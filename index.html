<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuikerPick: Pick it Quiker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: basefont;
  background-color: #fffdd0;
}

.topnav {
  overflow: hidden;
  background-color: #26436D;
  padding: 4px 8px;
}

.topnav a {
  float: left;
  display: block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
}

.topnav a:hover {
  background-color: #D3A5AF;
  color: #FFFFFF;
}

.topnav a.active {
  background-color: #D3A5AF;
  color: white;
}

.topnav .search-container {
  float: right;
}

.topnav input[type=text] {
  padding: 10px 14px;
  margin-top: 8px;
  font-size: 17px;
  border: 2px solid #D3A5AF;
  border-radius: 8px;
  background-color: #fffdd0;
  color: #26436D;
  outline: none;
}

.topnav input[type=text]:focus {
  border-color: #26436D;
}

.topnav .search-container button {
  float: right;
  padding: 10px 16px;
  margin-top: 8px;
  margin-right: 16px;
  background-color: #D3A5AF;
  color: white;
  font-size: 17px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.topnav .search-container button:hover {
  background-color: #26436D;
}

@font-face {
  font-family: basefont;
  src: url(fonts/Scanport-1.ttf);
}

#results {
  padding: 24px;
}

#productResults {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 20px;
}

#productResults a {
  text-decoration: none;
  color: #26436D;
}

#productResults a > div {
  width: 300px;
  padding: 20px;
  background-color: white;
  border: 2px solid #D3A5AF;
  border-radius: 12px;
}

#productResults img {
  width: 100%;
  height: 200px;
  object-fit: contain;
}
</style>
</head>

<body>

<div class="topnav">
  <a class="active" href="#home">Home</a>
  <a href="#about">About</a>
  <a href="signup.html">Signup</a>

  <div class="search-container">
    <form>
      <input type="text" placeholder="Search.." name="search">
      <button type="submit">Submit</button>
    </form>
  </div>
</div>

<div id="results"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://nhhfskfggryiqbyvjbzj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"YOUR_PUBLIC_KEY_HERE";


const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


const params =
new URLSearchParams(window.location.search);

const search =
params.get("search");


async function showResults(){

if(!search){
 return;
}


const {data:products,error} =
await supabaseClient
.from("products")
.select("*");


if(error){

document.getElementById("results").innerHTML =
"<h2>Could not load products</h2>";

return;

}


let resultsHTML =

"<h2>Search results for: "
+ search +
"</h2>" +

"<div id='productResults'></div>";


document.getElementById("results").innerHTML =
resultsHTML;



const matchingProducts =
products.filter(product =>
product.name
.toLowerCase()
.includes(search.toLowerCase())
);



let html = "";


matchingProducts.forEach(product=>{


html +=

"<a href='" +
product.link +
"'>" +

"<div>" +

(product.image ?
"<img src='" +
product.image +
"'>" : "")

+

"<h3>" +
product.name +
"</h3>" +

"<p>Store: " +
product.store +
"</p>" +

"<p>Price: " +
product.price +
"</p>" +

"</div>" +

"</a>";

});



if(matchingProducts.length===0){

html =
"<p>No products found.</p>";

}



document.getElementById("productResults")
.innerHTML = html;


}


showResults();

</script>

</body>
</html>
