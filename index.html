<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuikerPick: Pick it Quiker</title>

<style>
* {box-sizing: border-box;}

body {
  margin: 0;
  font-family: basefont;
  background-color: #fffdd0;
}

.topnav {
  overflow: hidden;
  background-color: #26436D;
  padding: 4px 8px;
}

.topnav a {
  float: left;
  display: block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
}

.topnav a:hover {
  background-color: #D3A5AF;
  color: #FFFFFF;
}

.topnav a.active {
  background-color: #D3A5AF;
  color: white;
}

.topnav .search-container {
  float: right;
}

.topnav input[type=text] {
  padding: 10px 14px;
  margin-top: 8px;
  font-size: 17px;
  border: 2px solid #D3A5AF;
  border-radius: 8px;
  background-color: #fffdd0;
  color: #26436D;
  outline: none;
}

.topnav input[type=text]:focus {
  border-color: #26436D;
  box-shadow: 0 0 0 3px rgba(211, 165, 175, 0.35);
}

.topnav .search-container button {
  float: right;
  padding: 10px 16px;
  margin-top: 8px;
  margin-right: 16px;
  background-color: #D3A5AF;
  color: #FFFFFF;
  font-size: 17px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.15s ease, background-color 0.15s ease;
}

.topnav .search-container button:hover {
  background-color: #26436D;
  transform: scale(1.05);
}

@media screen and (max-width: 600px) {
  .topnav .search-container {
    float: none;
  }

  .topnav a,
  .topnav input[type=text],
  .topnav .search-container button {
    float: none;
    display: block;
    text-align: left;
    width: 100%;
    margin: 4px 0;
    padding: 14px;
  }

  .topnav input[type=text] {
    border: 1px solid #D3A5AF;
  }

  #productResults {
    gap: 15px;
  }

  #productResults a > div {
    width: 100%;
  }
}

@font-face {
  font-family: basefont;
  src: url(fonts/Scanport-1.ttf);
}

#currencySelect {
  padding: 10px 14px;
  margin: 10px 0;
  font-size: 16px;
  font-family: inherit;
  background-color: #fffdd0;
  color: #26436D;
  border: 2px solid #D3A5AF;
  border-radius: 8px;
  cursor: pointer;
  outline: none;
}

#currencySelect:hover {
  border-color: #26436D;
}

#currencySelect:focus {
  border-color: #D3A5AF;
}

#results {
  padding: 24px;
}

#results h2 {
  color: #26436D;
  margin-bottom: 10px;
  font-size: 28px;
  font-weight: bolder;
}

#results label {
  color: #26436D;
  font-size: 16px;
}

#productResults {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 20px;
}

#productResults a {
  text-decoration: none;
  color: #26436D;
}

#productResults a > div {
  width: 300px;
  padding: 20px;
  background-color: #FFFFFF !important;
  border: 2px solid #D3A5AF !important;
  border-radius: 12px !important;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#productResults a > div:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 15px rgba(38, 67, 109, 0.2);
}

#productResults h3 {
  color: #26436D;
  margin-top: 0;
  font-size: 19.6px;
}

#productResults p {
  color: #26436D;
}

#productResults p:last-child {
  font-size: 20px;
  font-weight: bold;
  color: #26436D;
  margin-top: 14px;
}

.product-image {
  width: 100%;
  height: 200px;
  object-fit: contain;
  border-radius: 8px;
  margin-bottom: 12px;
}

#loadMoreButton {
  display: block;
  margin: 30px auto;
  padding: 12px 24px;
  background-color: #D3A5AF;
  color: white;
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#loadMoreButton:hover {
  background-color: #26436D;
}

#loadingMessage {
  width: 100%;
  color: #26436D;
  font-size: 18px;
  margin: 10px 0;
}
</style>
</head>

<body>

<div class="topnav">
  <a class="active" href="#home">Home</a>
  <a href="#about">About</a>
  <a href="signup.html">Signup</a>

  <div class="search-container">
    <form>
      <input type="text" placeholder="Search.." name="search">
      <button type="submit">Submit</button>
    </form>
  </div>
</div>

<div style="font-size: x-large;" id="results"></div>

<script>

const ETSY_FUNCTION_URL =
    "https://nhhfskfggryiqbyvjbzj.supabase.co/functions/v1/etsy-api";

const params =
    new URLSearchParams(window.location.search);

const search =
    params.get("search");


let selectedCurrency = "NGN";

let currentPage = 1;

let loading = false;

let hasMoreProducts = true;

let products = [];

let exchangeRates;


const currencies = {

    NGN: "Nigerian Naira (₦)",

    USD: "US Dollar ($)",

    GBP: "British Pound (£)",

    EUR: "Euro (€)",

    EGP: "Egyptian Pound (E£)",

    INR: "Indian Rupee (₹)",

    JPY: "Japanese Yen (¥)"

};



/*
 * Limit titles by WORDS.
 *
 * This is a 10-WORD limit,
 * not a character limit.
 */

function limitTitleWords(title, maxWords) {

    if (!title) {
        return "";
    }

    const words =
        title.trim().split(/\s+/);

    if (words.length <= maxWords) {
        return title;
    }

    return (
        words
            .slice(0, maxWords)
            .join(" ") +
        "..."
    );
}



/*
 * Get exchange rates.
 */

async function loadExchangeRates() {

    try {

        const response =
            await fetch(
                "https://open.er-api.com/v6/latest/NGN"
            );

        const data =
            await response.json();

        if (data.result !== "success") {
            throw new Error(
                "Exchange rate request failed."
            );
        }

        exchangeRates =
            data.rates;

        return true;

    } catch (error) {

        console.error(
            "Exchange rate error:",
            error
        );

        return false;
    }
}



/*
 * Create the product card.
 */

function createProductCard(product) {

    if (!product.price) {
        return "";
    }


    const originalPrice =

        Number(product.price.amount) /

        Number(
            product.price.divisor || 100
        );


    const originalCurrency =
        product.price.currency_code;


    let priceInNGN;


    if (originalCurrency === "NGN") {

        priceInNGN =
            originalPrice;

    } else {

        const rateToNGN =
            exchangeRates[
                originalCurrency
            ];

        if (!rateToNGN) {
            return "";
        }

        priceInNGN =
            originalPrice /
            rateToNGN;
    }


    const exchangeRate =
        exchangeRates[
            selectedCurrency
        ] || 1;


    const convertedPrice =
        priceInNGN *
        exchangeRate;


    const formattedPrice =

        new Intl.NumberFormat(

            undefined,

            {
                style: "currency",

                currency:
                    selectedCurrency
            }

        ).format(
            convertedPrice
        );


    /*
     * Etsy listing URL
     */

    const productLink =

        "https://www.etsy.com/listing/" +
        product.listing_id;


    /*
     * Etsy image.
     *
     * Etsy can return several image
     * sizes. Try the largest useful
     * one first, then fall back.
     */

    let productImage = "";


    if (
        product.images &&
        product.images.length > 0
    ) {

        const image =
            product.images[0];


        productImage =

            image.url_fullxfull ||
            image.url_570xN ||
            image.url_300x300 ||
            image.url_170x135 ||
            "";
    }


    const title =

        limitTitleWords(
            product.title,
            10
        );


    return

        "<a href='" +
        productLink +
        "' target='_blank' " +
        "rel='noopener noreferrer'>" +

            "<div>" +

                (
                    productImage

                        ? "<img " +
                          "class='product-image' " +
                          "src='" +
                          productImage +
                          "' " +
                          "alt='" +
                          title +
                          "'>"

                        : ""
                ) +

                "<h3>" +
                title +
                "</h3>" +

                "<p>Store: Etsy</p>" +

                "<p>Price: " +
                formattedPrice +
                "</p>" +

            "</div>" +

        "</a>";
}



/*
 * Display all loaded products.
 */

function displayProducts() {

    const productResults =
        document.getElementById(
            "productResults"
        );


    let productsHTML = "";


    products.forEach(
        product => {

            productsHTML +=
                createProductCard(
                    product
                );
        }
    );


    if (!productsHTML) {

        productsHTML =
            "<p>No Etsy products found.</p>";
    }


    productResults.innerHTML =
        productsHTML;


    /*
     * Add loading-more button
     */

    if (hasMoreProducts) {

        productResults.innerHTML +=

            "<button id='loadMoreButton'>" +
            "Load More Products" +
            "</button>";

        document
            .getElementById(
                "loadMoreButton"
            )
            .addEventListener(
                "click",
                loadMoreProducts
            );
    }
}



/*
 * Ask the Edge Function for
 * another Etsy page.
 */

async function loadMoreProducts() {

    if (loading || !hasMoreProducts) {
        return;
    }


    loading = true;


    const button =
        document.getElementById(
            "loadMoreButton"
        );


    if (button) {

        button.disabled = true;

        button.textContent =
            "Loading...";
    }


    try {

        const response =

            await fetch(
                ETSY_FUNCTION_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            search:
                                search,

                            page:
                                currentPage
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Etsy request failed."
            );
        }


        const newProducts =
            data.results || [];


        if (
            newProducts.length === 0
        ) {

            hasMoreProducts =
                false;

        } else {

            products =
                products.concat(
                    newProducts
                );

            currentPage++;
        }


        displayProducts();


    } catch (error) {

        console.error(
            "Etsy error:",
            error
        );


        if (button) {

            button.disabled =
                false;

            button.textContent =
                "Try Again";
        }

    } finally {

        loading =
            false;
    }
}



/*
 * Initial page setup.
 */

async function showResults() {

    if (!search) {
        return;
    }


    document
        .getElementById("results")
        .innerHTML =

        "<h2>Search results for: " +
        search +
        "</h2>" +

        "<label for='currencySelect'>" +
        "Currency: " +
        "</label>" +

        "<select id='currencySelect'>";



    let currencyOptions = "";


    for (
        const code in currencies
    ) {

        currencyOptions +=

            "<option value='" +
            code +
            "'" +

            (
                code ===
                selectedCurrency
                    ? " selected"
                    : ""
            ) +

            ">" +

            currencies[code] +

            "</option>";
    }


    document
        .getElementById("results")
        .innerHTML +=

        currencyOptions +

        "</select>" +

        "<div id='productResults'>" +

        "<p id='loadingMessage'>" +
        "Loading Etsy products..." +
        "</p>" +

        "</div>";


    /*
     * Currency selector
     */

    document
        .getElementById(
            "currencySelect"
        )
        .addEventListener(
            "change",
            function () {

                selectedCurrency =
                    this.value;

                displayProducts();
            }
        );


    /*
     * Exchange rates first.
     */

    const ratesLoaded =
        await loadExchangeRates();


    if (!ratesLoaded) {

        document
            .getElementById(
                "productResults"
            )
            .innerHTML =

            "<p>We couldn't load the " +
            "exchange rates right now.</p>";

        return;
    }


    /*
     * Load first Etsy page.
     */

    await loadMoreProducts();
}


showResults();

</script>

</body>
</html>
