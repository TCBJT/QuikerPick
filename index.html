<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuikerPick: Pick it Quiker</title>

<style>
* {box-sizing: border-box;}

body {
  margin: 0;
  font-family: basefont;
  background-color: #fffdd0;
}

.topnav {
  overflow: hidden;
  background-color: #26436D;
  padding: 4px 8px;
}

.topnav a {
  float: left;
  display: block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
}

.topnav a:hover {
  background-color: #D3A5AF;
  color: #FFFFFF;
}

.topnav a.active {
  background-color: #D3A5AF;
  color: white;
}

.topnav .search-container {
  float: right;
}

.topnav input[type=text] {
  padding: 10px 14px;
  margin-top: 8px;
  font-size: 17px;
  border: 2px solid #D3A5AF;
  border-radius: 8px;
  background-color: #fffdd0;
  color: #26436D;
  outline: none;
}

.topnav input[type=text]:focus {
  border-color: #26436D;
  box-shadow: 0 0 0 3px rgba(211, 165, 175, 0.35);
}

.topnav .search-container button {
  float: right;
  padding: 10px 16px;
  margin-top: 8px;
  margin-right: 16px;
  background-color: #D3A5AF;
  color: #FFFFFF;
  font-size: 17px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.15s ease, background-color 0.15s ease;
}

.topnav .search-container button:hover {
  background-color: #26436D;
  transform: scale(1.05);
}

@media screen and (max-width: 600px) {
  .topnav .search-container {
    float: none;
  }

  .topnav a,
  .topnav input[type=text],
  .topnav .search-container button {
    float: none;
    display: block;
    text-align: left;
    width: 100%;
    margin: 4px 0;
    padding: 14px;
  }

  .topnav input[type=text] {
    border: 1px solid #D3A5AF;
  }

  #productResults {
    gap: 15px;
  }

  #productResults a > div {
    width: 100%;
  }
}

@font-face {
  font-family: basefont;
  src: url(fonts/Scanport-1.ttf);
}

#currencySelect {
  padding: 10px 14px;
  margin: 10px 0;
  font-size: 16px;
  font-family: inherit;
  background-color: #fffdd0;
  color: #26436D;
  border: 2px solid #D3A5AF;
  border-radius: 8px;
  cursor: pointer;
  outline: none;
}

#currencySelect:hover {
  border-color: #26436D;
}

#currencySelect:focus {
  border-color: #D3A5AF;
}

#results {
  padding: 24px;
}

#results h2 {
  color: #26436D;
  margin-bottom: 10px;
  font-size: 28px;
  font-weight: bolder;
}

#results label {
  color: #26436D;
  font-size: 16px;
}

#productResults {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 20px;
}

#productResults a {
  text-decoration: none;
  color: #26436D;
}

#productResults a > div {
  width: 300px;
  padding: 20px;
  background-color: #FFFFFF !important;
  border: 2px solid #D3A5AF !important;
  border-radius: 12px !important;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#productResults a > div:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 15px rgba(38, 67, 109, 0.2);
}

#productResults h3 {
  color: #26436D;
  margin-top: 0;
}

#productResults p {
  color: #26436D;
}

#productResults p:last-child {
  font-size: 20px;
  font-weight: bold;
  color: #26436D;
  margin-top: 14px;
}
</style>
</head>

<body>

<div class="topnav">
  <a class="active" href="#home">Home</a>
  <a href="#about">About</a>
  <a href="signup.html">Signup</a>

  <div class="search-container">
    <form>
      <input type="text" placeholder="Search.." name="search">
      <button type="submit">Submit</button>
    </form>
  </div>
</div>

<div style="font-size: x-large;" id="results"></div>

<script>
const params = new URLSearchParams(window.location.search);
const search = params.get("search");

async function showResults() {

    if (!search) {
        return;
    }

    let selectedCurrency = "NGN";

    const currencies = {
        NGN: "Nigerian Naira (₦)",
        USD: "US Dollar ($)",
        GBP: "British Pound (£)",
        EUR: "Euro (€)",
        EGP: "Egyptian Pound (E£)",
        INR: "Indian Rupee (₹)",
        JPY: "Japanese Yen (¥)"
    };

    // Ask the Supabase Edge Function for real Etsy products
    let products;

    try {

        const response = await fetch(
            "https://nhhfskfggryiqbyvjbzj.supabase.co/functions/v1/etsy-api",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    search: search
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Etsy request failed."
            );
        }

        products = data.results || [];

        console.log("Etsy products:", products);

    } catch (error) {

        console.error("Etsy error:", error);

        document.getElementById("results").innerHTML =
            "<h2>Search results for: " +
            search +
            "</h2>" +
            "<p>Could not load Etsy products.</p>";

        return;
    }


    // Get exchange rates
    let exchangeRates;

    try {

        const response = await fetch(
            "https://open.er-api.com/v6/latest/NGN"
        );

        const data = await response.json();

        if (data.result !== "success") {
            throw new Error(
                "Exchange rate request failed."
            );
        }

        exchangeRates = data.rates;

    } catch (error) {

        console.error("Exchange rate error:", error);

        document.getElementById("results").innerHTML =
            "<h2>Search results for: " +
            search +
            "</h2>" +
            "<p>We couldn't load the exchange rates right now.</p>";

        return;
    }


    // Currency dropdown
    let currencyOptions = "";

    for (const code in currencies) {

        currencyOptions +=
            "<option value='" +
            code +
            "'" +
            (code === selectedCurrency ? " selected" : "") +
            ">" +
            currencies[code] +
            "</option>";
    }


    let resultsHTML =
        "<h2>Search results for: " +
        search +
        "</h2>" +

        "<label for='currencySelect'>Currency: </label>" +

        "<select id='currencySelect'>" +
            currencyOptions +
        "</select>" +

        "<div id='productResults'></div>";


    document.getElementById("results").innerHTML =
        resultsHTML;


    function displayProducts(currencyCode) {

        let productsHTML = "";


        products.forEach(product => {

            if (!product.price) {
                return;
            }


            // Etsy price
            const originalPrice =
                Number(product.price.amount) /
                Number(product.price.divisor || 100);


            const originalCurrency =
                product.price.currency_code;


            // Convert original Etsy currency to NGN
            let priceInNGN;

            if (originalCurrency === "NGN") {

                priceInNGN = originalPrice;

            } else {

                const rateToNGN =
                    exchangeRates[originalCurrency];

                if (!rateToNGN) {
                    return;
                }

                priceInNGN =
                    originalPrice / rateToNGN;
            }


            // Convert NGN to selected currency
            const exchangeRate =
                exchangeRates[currencyCode] || 1;

            const convertedPrice =
                priceInNGN * exchangeRate;


            const formattedPrice =
                new Intl.NumberFormat(
                    undefined,
                    {
                        style: "currency",
                        currency: currencyCode
                    }
                ).format(convertedPrice);


            // Etsy listing link
            const productLink =
                "https://www.etsy.com/listing/" +
                product.listing_id;


            // Etsy product image
            const productImage =
                product.images &&
                product.images.length > 0
                    ? product.images[0].url_570xN
                    : "";


            productsHTML +=

                "<a href='" +
                productLink +
                "' target='_blank' " +
                "rel='noopener noreferrer'>" +

                    "<div>" +

                        (
                            productImage
                                ? "<img src='" +
                                  productImage +
                                  "' alt='" +
                                  product.title +
                                  "' style='" +
                                      "width: 100%;" +
                                      "height: 200px;" +
                                      "object-fit: contain;" +
                                      "border-radius: 8px;" +
                                      "margin-bottom: 12px;" +
                                  "'>"
                                : ""
                        ) +

                        "<h3>" +
                        product.title +
                        "</h3>" +

                        "<p>Store: Etsy</p>" +

                        "<p>Price: " +
                        formattedPrice +
                        "</p>" +

                    "</div>" +

                "</a>";
        });


        if (!productsHTML) {

            productsHTML =
                "<p>No Etsy products found.</p>";
        }


        document.getElementById("productResults").innerHTML =
            productsHTML;
    }


    displayProducts(selectedCurrency);


    document
        .getElementById("currencySelect")
        .addEventListener(
            "change",
            function () {

                selectedCurrency = this.value;

                displayProducts(selectedCurrency);
            }
        );
}


showResults();
</script>

</body>
</html>
